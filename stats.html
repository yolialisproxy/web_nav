<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>访问统计 - 啃魂导航</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/admin.css">
    <style>
        .stats-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .stats-title {
            font-size: 28px;
            font-weight: bold;
        }

        .stats-controls {
            display: flex;
            gap: 10px;
        }

        .time-range-selector {
            padding: 8px 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
            cursor: pointer;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stats-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .stats-card-title {
            font-size: 16px;
            color: #666;
            margin-bottom: 10px;
        }

        .stats-card-value {
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }

        .chart-container {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .chart-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .chart-wrapper {
            position: relative;
            height: 300px;
        }

        .top-sites-table {
            width: 100%;
            border-collapse: collapse;
        }

        .top-sites-table th,
        .top-sites-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .top-sites-table th {
            background: #f5f5f5;
            font-weight: bold;
        }

        .top-sites-table tr:hover {
            background: #f9f9f9;
        }

        .rank-badge {
            display: inline-block;
            width: 24px;
            height: 24px;
            line-height: 24px;
            text-align: center;
            border-radius: 50%;
            background: #4CAF50;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .rank-badge.gold { background: #FFD700; color: #333; }
        .rank-badge.silver { background: #C0C0C0; color: #333; }
        .rank-badge.bronze { background: #CD7F32; }

        .export-btn {
            padding: 8px 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .export-btn:hover {
            background: #45a049;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar" aria-label="main navigation">
        <div class="navbar-brand">
            <a href="index.html">啃魂导航</a aria-label="啃魂导航">
        </div>
        <div class="navbar-menu">
            <a href="index.html">首页</a aria-label="首页">
            <a href="admin.html">管理后台</a aria-label="管理后台">
            <a href="stats.html" class="active">访问统计</a aria-label="访问统计">
        </div>
    </nav>

    <!-- 统计内容 -->
    <div class="stats-container">
        <!-- 头部 -->
        <div class="stats-header">
            <h1 class="stats-title">访问统计</h1>
            <div class="stats-controls">
                <select id="timeRange" class="time-range-selector">
                    <option value="7">最近7天</option>
                    <option value="30">最近30天</option>
                    <option value="90">最近90天</option>
                </select>
                <button id="exportBtn" class="export-btn">导出数据</button aria-label="导出数据">
            </div>
        </div>

        <!-- 统计卡片 -->
        <div class="stats-grid">
            <div class="stats-card">
                <div class="stats-card-title">总访问量</div>
                <div class="stats-card-value" id="totalVisits">0</div>
            </div>
            <div class="stats-card">
                <div class="stats-card-title">独立网站数</div>
                <div class="stats-card-value" id="uniqueSites">0</div>
            </div>
            <div class="stats-card">
                <div class="stats-card-title">今日访问</div>
                <div class="stats-card-value" id="todayVisits">0</div>
            </div>
            <div class="stats-card">
                <div class="stats-card-title">平均每日访问</div>
                <div class="stats-card-value" id="avgVisits">0</div>
            </div>
        </div>

        <!-- 访问趋势图表 -->
        <div class="chart-container">
            <div class="chart-title">访问趋势</div>
            <div class="chart-wrapper">
                <canvas id="trendChart"></canvas>
            </div>
        </div>

        <!-- 热门网站排行 -->
        <div class="chart-container">
            <div class="chart-title">热门网站排行</div>
            <div id="topSitesContainer">
                <table class="top-sites-table">
                    <thead>
                        <tr>
                            <th>排名</th>
                            <th>网站名称</th>
                            <th>访问次数</th>
                            <th>占比</th>
                        </tr>
                    </thead>
                    <tbody id="topSitesTable">
                        <tr>
                            <td colspan="4" class="loading"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 分类分布图表 -->
        <div class="chart-container">
            <div class="chart-title">分类访问分布</div>
            <div class="chart-wrapper">
                <canvas id="categoryChart"></canvas>
            </div>
        </div>
    </div>

    <!-- 引入依赖 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="assets/js/utils/crypto-util.js"></script>
    <script src="assets/js/utils/validation-util.js"></script>
    <script src="assets/js/utils/storage-util.js"></script>
    <script src="assets/js/modules/statistics-manager.js"></script>
    <script src="assets/js/modules/data-manager.js"></script>

    <script>
        // 统计页面管理器
        class StatsPageManager {
            constructor() {
                this.statisticsManager = new StatisticsManager();
                this.dataManager = new DataManager();
                this.trendChart = null;
                this.categoryChart = null;
                this.currentRange = 7;
            }

            async initialize() {
                // 初始化管理器
                await this.statisticsManager.initialize();
                await this.dataManager.initialize();

                // 绑定事件
                this._bindEvents();

                // 加载数据
                await this.loadData();
            }

            _bindEvents() {
                // 时间范围选择
                document.getElementById('timeRange').addEventListener('change', async (e) => {
                    this.currentRange = parseInt(e.target.value);
                    await this.loadData();
                });

                // 导出按钮
                document.getElementById('exportBtn').addEventListener('click', async () => {
                    await this.exportData();
                });
            }

            async loadData() {
                const days = this.currentRange;
                const startDate = new Date();
                startDate.setDate(startDate.getDate() - days);

                // 获取统计数据
                const stats = await this.statisticsManager.getStatistics({
                    startDate: startDate.toISOString().split('T')[0]
                });

                if (!stats.success) {
                    this._showError(stats.message);
                    return;
                }

                // 更新统计卡片
                this._updateStatsCards(stats.data, days);

                // 更新趋势图表
                await this._updateTrendChart(days);

                // 更新热门网站
                await this._updateTopSites();

                // 更新分类分布
                this._updateCategoryChart(stats.data);
            }

            _updateStatsCards(data, days) {
                document.getElementById('totalVisits').textContent = data.total;
                document.getElementById('uniqueSites').textContent = data.unique;
                
                // 今日访问
                const today = new Date().toISOString().split('T')[0];
                document.getElementById('todayVisits').textContent = data.byDate[today] || 0;
                
                // 平均每日访问
                const avg = Math.round(data.total / days);
                document.getElementById('avgVisits').textContent = avg;
            }

            async _updateTrendChart(days) {
                const trend = await this.statisticsManager.getTrend(days);
                
                if (!trend.success) {
                    return;
                }

                const ctx = document.getElementById('trendChart').getContext('2d');
                
                // 销毁旧图表
                if (this.trendChart) {
                    this.trendChart.destroy();
                }

                // 创建新图表
                this.trendChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: trend.trend.map(t => t.date),
                        datasets: [{
                            label: '访问量',
                            data: trend.trend.map(t => t.count),
                            borderColor: '#4CAF50',
                            backgroundColor: 'rgba(76, 175, 80, 0.1)',
                            tension: 0.4,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: false
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            }

            async _updateTopSites() {
                const topSites = await this.statisticsManager.getTopSites(10, {
                    startDate: this._getStartDate()
                });

                const tbody = document.getElementById('topSitesTable');
                
                if (!topSites.success || topSites.sites.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="no-data">暂无数据</td></tr>';
                    return;
                }

                // 获取网站详情
                const sites = this.dataManager.getSites();
                const siteMap = new Map(sites.map(s => [s.id, s]));

                // 计算总访问量
                const total = topSites.sites.reduce((sum, s) => sum + s.count, 0);

                tbody.innerHTML = topSites.sites.map((site, index) => {
                    const siteInfo = siteMap.get(site.siteId) || { name: '未知网站' };
                    const percent = ((site.count / total) * 100).toFixed(1);
                    const rankClass = index === 0 ? 'gold' : index === 1 ? 'silver' : index === 2 ? 'bronze' : '';

                    return `
                        <tr>
                            <td><span class="rank-badge ${rankClass}">${index + 1}</span></td>
                            <td>${siteInfo.name}</td>
                            <td>${site.count}</td>
                            <td>${percent}%</td>
                        </tr>
                    `;
                }).join('');
            }

            _updateCategoryChart(data) {
                const categories = Object.entries(data.byCategory);
                
                if (categories.length === 0) {
                    return;
                }

                const ctx = document.getElementById('categoryChart').getContext('2d');
                
                // 销毁旧图表
                if (this.categoryChart) {
                    this.categoryChart.destroy();
                }

                // 创建新图表
                this.categoryChart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: categories.map(c => c[0]),
                        datasets: [{
                            data: categories.map(c => c[1]),
                            backgroundColor: [
                                '#4CAF50', '#2196F3', '#FF9800', '#E91E63',
                                '#9C27B0', '#00BCD4', '#FFC107', '#795548',
                                '#607D8B', '#8BC34A'
                            ]
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                position: 'right'
                            }
                        }
                    }
                });
            }

            async exportData() {
                const result = await this.statisticsManager.exportData('json');
                
                if (!result.success) {
                    alert(result.message);
                    return;
                }

                // 下载文件
                const blob = new Blob([result.data], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `stats-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
            }

            _getStartDate() {
                const startDate = new Date();
                startDate.setDate(startDate.getDate() - this.currentRange);
                return startDate.toISOString().split('T')[0];
            }

            _showError(message) {
                document.getElementById('topSitesTable').innerHTML = 
                    `<tr><td colspan="4" class="no-data">${message}</td></tr>`;
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            const manager = new StatsPageManager();
            await manager.initialize();
        });
    </script>
</body>
</html>
