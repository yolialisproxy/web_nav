<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="theme-color" content="#667eea" />

  <!-- SEO -->
  <title>在线翻译 - 啃魂导航</title>
  <meta name="description" content="免费的在线翻译工具，支持多语言互译" />

  <!-- Favicon -->
  <link rel="shortcut icon" href="./assets/images/favicon.svg" />
  <link rel="icon" type="image/svg+xml" href="./assets/images/favicon.svg" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="./manifest.json" />

  <!-- 样式 -->
  <link rel="stylesheet" href="assets/css/merged.css" />
  <link rel="stylesheet" href="assets/css/merged.css" />
  <link rel="stylesheet" href="assets/css/merged.css" />

  <style>
    .translate-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .translate-container {
      width: 100%;
      max-width: 600px;
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      padding: 32px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
    }

    .translate-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .translate-header h1 {
      font-size: 28px;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .translate-header p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .translate-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .lang-selector {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .lang-selector select {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid var(--border-color);
      border-radius: var(--radius-md);
      background: var(--bg-body);
      color: var(--text-primary);
      font-size: 15px;
      cursor: pointer;
      transition: border-color var(--transition-fast);
    }

    .lang-selector select:focus {
      outline: none;
      border-color: var(--color-primary);
    }

    .lang-swap {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--border-light);
      border: none;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
    }

    .lang-swap:hover {
      background: var(--color-primary);
      color: white;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      padding: 16px;
      border: 2px solid var(--border-color);
      border-radius: var(--radius-lg);
      background: var(--bg-body);
      color: var(--text-primary);
      font-size: 16px;
      line-height: 1.6;
      resize: vertical;
      transition: border-color var(--transition-fast);
    }

    textarea:focus {
      outline: none;
      border-color: var(--color-primary);
    }

    textarea::placeholder {
      color: var(--text-muted);
    }

    .translate-btn {
      width: 100%;
      padding: 14px;
      background: var(--color-primary);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .translate-btn:hover {
      background: var(--color-primary-dark);
      transform: translateY(-1px);
    }

    .translate-btn:active {
      transform: translateY(0);
    }

    .translate-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .result-area {
      margin-top: 16px;
      padding: 16px;
      background: var(--bg-body);
      border-radius: var(--radius-lg);
      min-height: 80px;
    }

    .result-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .result-text {
      font-size: 16px;
      color: var(--text-primary);
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .result-loading {
      color: var(--text-muted);
      font-style: italic;
    }

    .result-error {
      color: #ff6b6b;
    }

    .result-actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }

    .copy-btn, .swap-lang-btn {
      padding: 8px 16px;
      background: var(--border-light);
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 13px;
      color: var(--text-secondary);
      transition: all var(--transition-fast);
    }

    .copy-btn:hover, .swap-lang-btn:hover {
      background: var(--color-primary);
      color: white;
    }

    .back-link {
      position: fixed;
      top: 16px;
      left: 16px;
      padding: 8px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      transition: all var(--transition-fast);
      z-index: 100;
    }

    .back-link:hover {
      background: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
    }

    .lang-options {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
    }

    .swap-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--border-light);
      border: none;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
    }

    .swap-btn:hover {
      background: var(--color-primary);
      color: white;
      transform: rotate(180deg);
    }

    /* 快捷语言按钮 */
    .quick-langs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .quick-lang-btn {
      padding: 6px 12px;
      background: var(--border-light);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .quick-lang-btn:hover, .quick-lang-btn.active {
      background: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
    }

    .history-section {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border-color);
    }

    .history-title {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: var(--bg-body);
      border-radius: var(--radius-md);
      font-size: 13px;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .history-item:hover {
      background: var(--border-light);
    }

    .history-text {
      color: var(--text-primary);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-lang {
      color: var(--text-muted);
      font-size: 11px;
      margin: 0 12px;
    }

    .history-delete {
      color: var(--text-muted);
      padding: 4px;
      opacity: 0;
      transition: opacity var(--transition-fast);
    }

    .history-item:hover .history-delete {
      opacity: 1;
    }

    .history-delete:hover {
      color: #ff6b6b;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-link">← 返回导航</a>

  <div class="translate-page">
    <div class="translate-container">
      <div class="translate-header">
        <h1>🌐 在线翻译</h1>
        <p>支持多种语言的即时翻译</p>
      </div>

      <div class="translate-form">
        <!-- 快捷语言选择 -->
        <div class="quick-langs" id="quickLangs">
          <button class="quick-lang-btn active" data-from="auto" data-to="zh">自动→中文</button>
          <button class="quick-lang-btn" data-from="en" data-to="zh">英译中</button>
          <button class="quick-lang-btn" data-from="zh" data-to="en">中译英</button>
          <button class="quick-lang-btn" data-from="zh" data-to="ja">中译日</button>
          <button class="quick-lang-btn" data-from="zh" data-to="ko">中译韩</button>
        </div>

        <!-- 语言选择 -->
        <div class="lang-options">
          <select id="langFrom">
            <option value="auto">自动检测</option>
            <option value="zh">中文</option>
            <option value="en" selected>English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
            <option value="ru">Русский</option>
            <option value="ar">العربية</option>
            <option value="pt">Português</option>
            <option value="it">Italiano</option>
          </select>

          <button class="swap-btn" id="swapBtn" title="交换语言">⇄</button>

          <select id="langTo">
            <option value="zh" selected>中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="fr">Français</option>
            <option value="de">Deutsch</option>
            <option value="es">Español</option>
            <option value="ru">Русский</option>
            <option value="ar">العربية</option>
            <option value="pt">Português</option>
            <option value="it">Italiano</option>
          </select>
        </div>

        <!-- 输入框 -->
        <textarea
          id="inputText"
          placeholder="输入要翻译的文本..."
        ></textarea>

        <!-- 翻译按钮 -->
        <button class="translate-btn" id="translateBtn">翻译</button>

        <!-- 结果区域 -->
        <div class="result-area" id="resultArea" style="display: none;">
          <div class="result-label">翻译结果</div>
          <div class="result-text" id="resultText"></div>
          <div class="result-actions">
            <button class="copy-btn" id="copyBtn">复制结果</button>
            <button class="swap-lang-btn" id="useAsInputBtn">翻译此结果</button>
          </div>
        </div>
      </div>

      <!-- 翻译历史 -->
      <div class="history-section" id="historySection" style="display: none;">
        <div class="history-title">最近翻译</div>
        <div class="history-list" id="historyList"></div>
      </div>
    </div>
  </div>

  <script>
    // 翻译历史管理
    const HISTORY_KEY = 'translate_history';
    const MAX_HISTORY = 10;

    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveHistory(history) {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    }

    function addToHistory(text, result, from, to) {
      const history = getHistory();
      history.unshift({
        text,
        result,
        from,
        to,
        time: Date.now()
      });
      if (history.length > MAX_HISTORY) {
        history.pop();
      }
      saveHistory(history);
      renderHistory();
    }

    function deleteHistory(index) {
      const history = getHistory();
      history.splice(index, 1);
      saveHistory(history);
      renderHistory();
    }

    function renderHistory() {
      const history = getHistory();
      const section = document.getElementById('historySection');
      const list = document.getElementById('historyList');

      if (history.length === 0) {
        section.style.display = 'none';
        return;
      }

      section.style.display = 'block';
      list.innerHTML = history.map((item, index) => `
        <div class="history-item" data-index="${index}">
          <span class="history-text">${escapeHtml(item.text.slice(0, 30))}${item.text.length > 30 ? '...' : ''}</span>
          <span class="history-lang">${item.from} → ${item.to}</span>
          <span class="history-text">${escapeHtml(item.result.slice(0, 20))}${item.result.length > 20 ? '...' : ''}</span>
          <span class="history-delete" data-index="${index}">✕</span>
        </div>
      `).join('');

      // 点击历史项填充内容
      list.querySelectorAll('.history-item').forEach(item => {
        item.addEventListener('click', (e) => {
          if (e.target.classList.contains('history-delete')) {
            e.stopPropagation();
            deleteHistory(parseInt(e.target.dataset.index));
          } else {
            const index = parseInt(item.dataset.index);
            const historyItem = history[index];
            document.getElementById('inputText').value = historyItem.text;
            document.getElementById('langFrom').value = historyItem.from === 'auto' ? 'auto' : historyItem.from;
            document.getElementById('langTo').value = historyItem.to;
            document.getElementById('inputText').focus();
          }
        });
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // 翻译功能
    async function translate() {
      const input = document.getElementById('inputText');
      const fromLang = document.getElementById('langFrom').value;
      const toLang = document.getElementById('langTo').value;
      const btn = document.getElementById('translateBtn');
      const resultArea = document.getElementById('resultArea');
      const resultText = document.getElementById('resultText');

      const text = input.value.trim();
      if (!text) {
        alert('请输入要翻译的文本');
        return;
      }

      btn.disabled = true;
      btn.textContent = '翻译中...';
      resultArea.style.display = 'block';
      resultText.innerHTML = '<span class="result-loading">正在翻译...</span>';

      try {
        const langPair = `${fromLang === 'auto' ? 'zh' : fromLang}|${toLang}`;
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${langPair}`;

        const response = await fetch(url);
        const data = await response.json();

        if (data.responseStatus === 200 && data.responseData) {
          const translated = data.responseData.translatedText;
          resultText.textContent = translated;

          // 保存到历史
          addToHistory(text, translated, fromLang, toLang);
        } else {
          resultText.innerHTML = '<span class="result-error">翻译失败，请重试</span>';
        }
      } catch (error) {
        resultText.innerHTML = `<span class="result-error">翻译失败: ${error.message}</span>`;
      } finally {
        btn.disabled = false;
        btn.textContent = '翻译';
      }
    }

    // 事件绑定
    document.getElementById('translateBtn').addEventListener('click', translate);

    document.getElementById('inputText').addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 'Enter') {
        translate();
      }
    });

    // 交换语言
    document.getElementById('swapBtn').addEventListener('click', () => {
      const from = document.getElementById('langFrom');
      const to = document.getElementById('langTo');

      if (from.value !== 'auto') {
        const temp = from.value;
        from.value = to.value;
        to.value = temp;

        // 同时交换文本
        const input = document.getElementById('inputText');
        const resultText = document.getElementById('resultText');
        if (resultText.textContent && !resultText.querySelector('.result-error')) {
          const originalText = input.value;
          input.value = resultText.textContent;
        }
      }
    });

    // 复制结果
    document.getElementById('copyBtn').addEventListener('click', () => {
      const result = document.getElementById('resultText').textContent;
      navigator.clipboard.writeText(result).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.textContent = '已复制!';
        setTimeout(() => btn.textContent = '复制结果', 1500);
      });
    });

    // 使用结果作为输入
    document.getElementById('useAsInputBtn').addEventListener('click', () => {
      const result = document.getElementById('resultText').textContent;
      const input = document.getElementById('inputText');
      const from = document.getElementById('langFrom');
      const to = document.getElementById('langTo');

      input.value = result;
      from.value = to.value;
      input.focus();
    });

    // 快捷语言按钮
    document.getElementById('quickLangs').addEventListener('click', (e) => {
      if (e.target.classList.contains('quick-lang-btn')) {
        document.querySelectorAll('.quick-lang-btn').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');

        document.getElementById('langFrom').value = e.target.dataset.from;
        document.getElementById('langTo').value = e.target.dataset.to;
      }
    });

    // 初始化
    renderHistory();

    // 聚焦输入框
    document.getElementById('inputText').focus();
  </script>
</body>
</html>
